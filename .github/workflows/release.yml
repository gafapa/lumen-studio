name: Publicar versión

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta de la versión (p. ej. v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Aplicación portátil para Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Dependencias
        run: npm ci
      - name: Skills oficiales de HyperFrames y Remotion
        run: node scripts/update-vendor-skills.mjs
      - name: Navegador de Remotion
        run: npx remotion browser ensure
      - name: Node para el paquete
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tools | Out-Null
          Split-Path -Parent (Get-Command node).Source | Out-File -Encoding ascii -NoNewline .tools/node-path.txt
      - name: Empaquetar
        run: npm run package:desktop
      - name: Comprimir
        shell: pwsh
        run: |
          $zip = "Lumen-Studio-$env:TAG-win32-x64.zip"
          Compress-Archive -Path 'releases/Lumen Studio-win32-x64' -DestinationPath $zip
          "ZIP=$zip" >> $env:GITHUB_ENV
      - name: Publicar en GitHub Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:ZIP --clobber
          } else {
            gh release create $env:TAG $env:ZIP --title "Lumen Studio $env:TAG" --generate-notes --target $env:GITHUB_SHA
          }
